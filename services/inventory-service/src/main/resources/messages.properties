# =====================================================================================================
# inventory-service messages: texts only this service uses. Shared texts (validation, not found, server
# errors, ...) are in common-messages.properties from the stockline-common library; application.yml loads
# both (spring.messages.basename: messages,common-messages). A key here overrides the same key there.
#
# Rules (the same in every messages file):
#   - One key = one message. Sections: warehouse, stock, constraint.
#   - In Java, use the constants in com.stockline.inventory.constant.MessageKeys instead of typing a key.
#   - {0}, {1}, ... are filled in by the code (java.text.MessageFormat).
#   - In a message WITH {0}-style placeholders, write an apostrophe as two: ''{0}''  ->  'Cables'.
#     In a message WITHOUT placeholders, write it once: can't.
# =====================================================================================================


## warehouse ###########################################################################################

warehouse.code.duplicate=Warehouse with code ''{0}'' already exists
warehouse.delete.has-stock=Warehouse ''{0}'' still has stock levels, so it can not be deleted


## stock ###############################################################################################

stock.adjust.zero=The quantity of an adjustment can't be 0
stock.insufficient=Not enough stock of ''{0}'' in {1}: only {2} available


## constraint ##########################################################################################
# Shown when a unique key from the Flyway migrations rejects a row: two requests passed the service's
# check at the same moment. Key = "constraint." + the key name in the migration.

constraint.uk_warehouses_code=A warehouse with this code already exists
constraint.uk_stock_levels_warehouse_product=This stock was just created by someone else. Please try again.
