# =====================================================================================================
# order-service messages: texts only this service uses. Shared texts (validation, not found, server
# errors, ...) are in common-messages.properties from the stockline-common library; application.yml loads
# both (spring.messages.basename: messages,common-messages). A key here overrides the same key there.
#
# Rules (the same in every messages file):
#   - One key = one message. Sections: customer, order, constraint.
#   - In Java, use the constants in com.stockline.order.constant.MessageKeys instead of typing a key.
#   - {0}, {1}, ... are filled in by the code (java.text.MessageFormat).
#   - In a message WITH {0}-style placeholders, write an apostrophe as two: ''{0}''  ->  'Cables'.
#     In a message WITHOUT placeholders, write it once: can't.
# =====================================================================================================


## customer ############################################################################################

customer.name.duplicate=Customer ''{0}'' already exists
customer.delete.has-orders=Customer ''{0}'' has sales orders, so it can not be deleted


## order ###############################################################################################

order.product.twice=Product {0} is on the order more than once; put it on one line with the total quantity
order.product.inactive=Product ''{0}'' is inactive and can not be sold
order.total.too-large=The order total {0} is above the limit of {1}


## constraint ##########################################################################################
# Shown when a unique key from the Flyway migrations rejects a row: two requests passed the service's
# check at the same moment. Key = "constraint." + the key name in the migration.

constraint.uk_customers_name=A customer with this name already exists
constraint.uk_sales_orders_order_number=This order number was just taken. Please try again.
constraint.uk_sales_order_items_order_product=This product is already on the order
