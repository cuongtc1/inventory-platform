# =====================================================================================================
# product-service messages: texts only this service uses. Shared texts (validation, not found, server
# errors, ...) are in common-messages.properties from the stockline-common library; application.yml loads
# both (spring.messages.basename: messages,common-messages). A key here overrides the same key there.
#
# In Java, use the constants in com.stockline.product.constant.MessageKeys instead of typing a key.
#
# Rules (the same in every messages file):
#   - One key = one message. Sections: category, supplier, product, constraint.
#   - {0}, {1}, ... are filled in by the code (java.text.MessageFormat).
#   - In a message WITH {0}-style placeholders, write an apostrophe as two: ''{0}''  ->  'Cables'.
#     In a message WITHOUT placeholders, write it once: can't.
# =====================================================================================================


## category ############################################################################################

category.name.duplicate=Category ''{0}'' already exists
category.parent.loop=A category can't be its own parent or be moved under one of its subcategories
category.delete.has-subcategories=Category ''{0}'' has subcategories; move or delete them first
category.delete.has-products=Category ''{0}'' still has products; move or delete them first


## supplier ############################################################################################

supplier.name.duplicate=Supplier ''{0}'' already exists
supplier.delete.has-products=Supplier ''{0}'' still has products; move or delete them first


## product #############################################################################################

product.sku.duplicate=Product with SKU ''{0}'' already exists


## constraint ##########################################################################################
# Shown when a unique key from the Flyway migrations rejects a row: two requests passed the service's
# check at the same moment. Key = "constraint." + the key name in the migration. Without a line here, the
# common text "A record with this value already exists" is used.

constraint.uk_categories_name=A category with this name already exists
constraint.uk_suppliers_name=A supplier with this name already exists
constraint.uk_products_sku=A product with this SKU already exists
