# =====================================================================================================
# product-service messages: every text the API returns, plus log texts.
#
# Loaded by Spring Boot's MessageSource (spring.messages.* in application.yml). In Java, use the
# constants in com.stockline.product.message.MessageKeys instead of typing a key.
#
# Rules:
#   - One key = one message. Sections: common, category, supplier, product, system.
#   - {0}, {1}, ... are filled in by the code (java.text.MessageFormat).
#   - In a message WITH {0}-style placeholders, write an apostrophe as two: ''{0}''  ->  'Cables'.
#     In a message WITHOUT placeholders, write it once: can't.
#   - Bean Validation messages use named placeholders such as {min} and {max}; they're filled in by the
#     validator, not by MessageFormat, so a single apostrophe is fine there.
#   - A future messages_vi.properties with the same keys would add Vietnamese (chosen by Accept-Language).
# =====================================================================================================


## common ##############################################################################################

# Bean Validation defaults. These keys are fixed by the Jakarta Validation spec; defining them here
# replaces Hibernate Validator's built-in texts for every annotation in every DTO.
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.Size.message=size must be between {min} and {max}
jakarta.validation.constraints.Positive.message=must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message=must be greater than or equal to 0
jakarta.validation.constraints.Digits.message=numeric value out of bounds (<{integer} digits>.<{fraction} digits> expected)
jakarta.validation.constraints.Email.message=must be a well-formed email address
jakarta.validation.constraints.Pattern.message=must match "{regexp}"

# Validation response
common.validation.failed=Validation failed
common.validation.invalid-value=has an invalid value ''{0}''
common.validation.wrong-type=has a value of the wrong type

# Bad requests
common.request.unreadable=Request body is missing or is not valid JSON
common.request.invalid-parameter=Parameter ''{0}'' has an invalid value ''{1}''
common.request.unknown-sort-field=Unknown sort field: {0}
common.request.no-endpoint=No endpoint {0} {1}

# Resources. {0} = resource name such as Category, {1} = id
common.resource.not-found={0} with id {1} not found
common.resource.duplicate=A record with this value already exists
common.resource.in-use=This record is still used by other records
common.resource.reference-missing=A referenced record no longer exists

# Server errors (the client never sees the real cause)
common.error.unexpected=An unexpected error occurred

# Spring MVC's own errors. Key = "problemDetail." + exception class; Spring fills in the placeholders.
# 405: {0} = method used, {1} = supported methods
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Method ''{0}'' is not supported.
# 415: {0} = content type sent, {1} = supported types
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Content-Type ''{0}'' is not supported.
# 406: {0} = types we can produce
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Acceptable representations: {0}.


## category ############################################################################################

category.name.duplicate=Category ''{0}'' already exists
# Same rule, caught by the database's unique key when two requests arrive at once (no name available)
category.name.duplicate-concurrent=A category with this name already exists
category.parent.loop=A category can't be its own parent or be moved under one of its subcategories
category.delete.has-subcategories=Category ''{0}'' has subcategories; move or delete them first
category.delete.has-products=Category ''{0}'' still has products; move or delete them first


## supplier ############################################################################################

supplier.name.duplicate=Supplier ''{0}'' already exists
supplier.name.duplicate-concurrent=A supplier with this name already exists
supplier.delete.has-products=Supplier ''{0}'' still has products; move or delete them first
# Bean Validation message, used as @Pattern(message = "{supplier.phone.invalid}")
supplier.phone.invalid=may contain only digits, spaces, +, -, ( and )


## product #############################################################################################

product.sku.duplicate=Product with SKU ''{0}'' already exists
product.sku.duplicate-concurrent=A product with this SKU already exists
# Bean Validation message, used as @Pattern(message = "{product.sku.invalid}")
product.sku.invalid=may contain only letters, digits, '.', '_' and '-'


## system ##############################################################################################
# Log texts only; never returned to the client.

# {0} = HTTP method, {1} = path
system.error.unexpected=Unexpected error on {0} {1}
